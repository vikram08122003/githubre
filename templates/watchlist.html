<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="nav-brand" href="/">◈ STOCKAI</a>
  <div class="nav-links">
    <a href="/">Analyze</a>
    <a href="/compare">Compare</a>
  </div>
</nav>
<div class="page">
  <h1 class="page-title">⭐ Watchlist</h1>
  <p class="page-subtitle">Your saved stocks</p>

  {% if watchlist %}
  <div class="card" style="padding:0; overflow:hidden;">
    <table class="wl-table">
      <thead>
        <tr><th>#</th><th>Symbol</th><th>Actions</th></tr>
      </thead>
      <tbody>
        {% for stock in watchlist %}
        <tr>
          <td class="text-muted font-mono" style="font-size:0.78rem;">{{ loop.index }}</td>
          <td><span class="font-mono" style="font-size:1rem; font-weight:600; color:var(--accent);">{{ stock }}</span></td>
          <td>
            <div class="flex gap-2">
              <form action="/analyze" method="POST" style="display:inline">
                <input type="hidden" name="symbol" value="{{ stock }}">
                <button type="submit" class="btn btn-primary" style="font-size:0.75rem; padding:6px 14px;">Analyze</button>
              </form>
              <a href="/compare?s1={{ stock }}" class="btn btn-ghost" style="font-size:0.75rem; padding:6px 14px;">Compare</a>
              <a href="/remove/{{ stock }}" class="btn btn-danger" style="font-size:0.75rem; padding:6px 14px;">Remove</a>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="card" style="text-align:center; padding:3rem;">
    <div style="font-size:2rem; margin-bottom:1rem;">📭</div>
    <p class="text-muted">Your watchlist is empty.</p>
    <a href="/" class="btn btn-primary mt-2" style="margin-top:1rem; display:inline-flex;">Analyze a Stock</a>
  </div>
  {% endif %}

  <div class="mt-3"><a href="/" class="btn btn-ghost">← Back to Home</a></div>
</div>
</body>
</html>
